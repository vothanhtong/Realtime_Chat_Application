name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch/PR cancels the run in progress
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend · tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Backend
    env:
      # mongodb-memory-server defaults to node_modules/.cache, which `npm ci`
      # wipes — keep the MongoDB binary outside node_modules so it can be cached.
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries
      # Pinned so the cache key is stable (matches mongodb-memory-server 10.x default)
      MONGOMS_VERSION: 7.0.24
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Cache MongoDB binary (mongodb-memory-server)
        uses: actions/cache@v4
        with:
          path: ${{ env.MONGOMS_DOWNLOAD_DIR }}
          key: mongodb-binaries-${{ runner.os }}-${{ runner.arch }}-${{ env.MONGOMS_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Syntax / module graph check
        run: npm run check

      - name: Run integration tests
        run: npm test

  frontend-build:
    name: Frontend · lint & build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check & build
        run: npm run build
